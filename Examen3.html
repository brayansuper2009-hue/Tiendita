<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen 3 - Calculadora IMC</title>
    
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body class="bg-black text-white">
   

    <header class="border-bottom border-secondary py-3 mb-4 text-center bg-black">
        <h1 class="h4 mb-0 fw-bold text-white">CALCULADORA IMC</h1>
    </header>

    <div class="container mb-5" style="max-width: 900px;">
        <div class="mb-4">
            <a href="index.html" class="text-secondary text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Volver al Menú
            </a>
        </div>

        <div class="card border-secondary shadow-lg bg-dark text-white rounded-3">
            <div class="row g-0">
                
                <div class="col-md-5 p-4 border-end border-secondary">
                    <h2 class="h5 text-white fw-bold mb-4 pb-2 border-bottom border-secondary">Datos</h2>
                    
                    <div class="mb-4">
                        <label for="peso" class="form-label fw-semibold text-white">Peso</label>
                        <div class="d-flex align-items-center gap-3">
                            <input type="range" class="form-range" min="0" max="300" value="70" step="0.01" id="peso" oninput="calcular()"> 
                            <span class="badge bg-light text-dark fs-6 text-nowrap" style="min-width: 85px;">
                                <span id="pesoValor">70</span> kg
                            </span>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="altura" class="form-label fw-semibold text-white">Altura</label>
                        <div class="d-flex align-items-center gap-3">
                            <input type="range" class="form-range" min="0" max="3" value="1.70" step="0.01" id="altura" oninput="calcular()"> 
                            <span class="badge bg-light text-dark fs-6 text-nowrap" style="min-width: 85px;">
                                <span id="alturaValor">1.70</span> m
                            </span>
                        </div>
                    </div>

                    <button onclick="reset()" class="btn btn-outline-light w-100 mt-4">
                        <i class="bi bi-arrow-counterclockwise me-1"></i> RESET
                    </button>
                </div>

                <div class="col-md-7 p-4 d-flex flex-column align-items-center text-center">
                    <h2 class="h5 text-white fw-bold mb-3 pb-2 border-bottom border-secondary w-100">Resultados</h2>
                    
                    <div class="row w-100 mb-3">
                        <div class="col-6">
                            <span class="text-secondary small d-block mb-1">IMC</span>
                            <span id="imcValor" class="display-6 fw-bold text-white">0</span>
                        </div>
                        <div class="col-6">
                            <span class="text-secondary small d-block mb-1">Clasificación</span>
                            <div id="clasificacionValor" class="fs-5 fw-bold text-white mt-2">-</div>
                        </div>
                    </div>
                    
                    <h2 class="h5 text-white fw-bold mb-3 pb-2 border-bottom border-secondary w-100">Tabla de Clasificación</h2>
                    
                    <div class="row w-100">
                        <div class="col-md-6 d-flex flex-column gap-2 pe-md-2">
                            <div id="card-bajo" style="background-color: #009FE3; padding: 10px; border-radius: 8px; transition: 0.3s; opacity: 0.4;">
                                <p style="margin: 0; color: #020000; font-weight: bold; font-size: 0.9rem;">Bajo peso</p>
                            </div>
                            <div id="card-normal" style="background-color: #92BD27; padding: 10px; border-radius: 8px; transition: 0.3s; opacity: 0.4;">
                                <p style="margin: 0; color: #020000; font-weight: bold; font-size: 0.9rem;">Peso normal</p>
                            </div>
                            <div id="card-sobrepeso" style="background-color: #F6C231; padding: 10px; border-radius: 8px; transition: 0.3s; opacity: 0.4;">
                                <p style="margin: 0; color: #020000; font-weight: bold; font-size: 0.9rem;">Sobrepeso</p>
                            </div>
                        </div>

                        <div class="col-md-6 d-flex flex-column gap-2 ps-md-2 mt-2 mt-md-0">
                            <div id="card-ob1" style="background-color: #E89B11; padding: 10px; border-radius: 8px; transition: 0.3s; opacity: 0.4;">
                                <p style="margin: 0; color: #020000; font-weight: bold; font-size: 0.9rem;">Obesidad 1</p>
                            </div>
                            <div id="card-ob2" style="background-color: #EC5B0C; padding: 10px; border-radius: 8px; transition: 0.3s; opacity: 0.4;">
                                <p style="margin: 0; color: #020000; font-weight: bold; font-size: 0.9rem;">Obesidad 2</p>
                            </div>
                            <div id="card-ob3" style="background-color: #E40613; padding: 10px; border-radius: 8px; transition: 0.3s; opacity: 0.4;">
                                <p style="margin: 0; color: #020000; font-weight: bold; font-size: 0.9rem;">Obesidad 3</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="java/bootstrap.bundle.min.js"></script>
    <script src="java/CalcularIMC.js"></script>
    <script src="java/sweetalert2.all.min.js"></script>
</body>
</html>
