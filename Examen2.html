<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center vh-100">
    

    <div class="container" style="max-width: 350px;">
        
        <a href="index.html" class="text-secondary text-decoration-none mb-3 d-inline-block">&larr; Volver al Menú</a>

        
        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-4">
                <h5 class="mb-4 text-dark">Calculadora</h5>
                
                
                <div class="d-flex align-items-center gap-3 mb-4">
                    <input type="range" class="form-range" id="Numero" min="1" max="10" value="1" oninput="calcular()"> 
                    <span id="Num" class="badge text-bg-primary fs-6">1</span>
                </div>
                    <div id="Resultados" class="bg-light rounded p-2 mb-4 text-dark" style="font-family: monospace; font-size: 1.1rem;">0</div>     
                <button onclick="reset()" class="btn btn-outline-danger w-100">Resetear</button>
            </div>
        </div>
    </div>

    <script src="java/Calculadora.js"></script>
</body>
</html>
